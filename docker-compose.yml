services:

  # --------------------------------------------------
  # PostgreSQL - Airflow Metadata Database
  # --------------------------------------------------
  postgres:
    image: postgres:16

    container_name: climate-postgres

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: always


  # --------------------------------------------------
  # pgAdmin - PostgreSQL GUI
  # --------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest

    container_name: climate-pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "8080:80"

    depends_on:
      postgres:
        condition: service_healthy

    restart: always


  # --------------------------------------------------
  # Common Airflow Configuration
  # --------------------------------------------------
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: climate-airflow-init

    working_dir: /opt/airflow

    env_file:
      - .env

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

      AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}

      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 10

      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}

      BIGQUERY_PROJECT: ${BIGQUERY_PROJECT}

      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME}

      GCS_LOCATION: ${GCS_LOCATION}

      GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/config/gcp-service-account.json

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./scripts:/opt/airflow/scripts
      - ./sql:/opt/airflow/sql
      - ./data:/opt/airflow/data
      - ./config:/opt/airflow/config

    user: "${AIRFLOW_UID:-50000}:0"

    depends_on:
      postgres:
        condition: service_healthy

    command: >
      bash -c "
        airflow db migrate
      "


  # --------------------------------------------------
  # Airflow API Server
  # --------------------------------------------------
  airflow-apiserver:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: climate-airflow-apiserver

    working_dir: /opt/airflow

    env_file:
      - .env

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

      AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}

      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 10

      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}

      BIGQUERY_PROJECT: ${BIGQUERY_PROJECT}

      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME}

      GCS_LOCATION: ${GCS_LOCATION}

      GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/config/gcp-service-account.json

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./scripts:/opt/airflow/scripts
      - ./sql:/opt/airflow/sql
      - ./data:/opt/airflow/data
      - ./config:/opt/airflow/config

    user: "${AIRFLOW_UID:-50000}:0"

    command: api-server

    ports:
      - "8081:8080"

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]

      interval: 30s

      timeout: 10s

      retries: 5

      start_period: 30s

    restart: always


  # --------------------------------------------------
  # Airflow Scheduler
  # --------------------------------------------------
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: climate-airflow-scheduler

    working_dir: /opt/airflow

    env_file:
      - .env

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

      AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}

      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 10

      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'

      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}

      BIGQUERY_PROJECT: ${BIGQUERY_PROJECT}

      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME}

      GCS_LOCATION: ${GCS_LOCATION}

      GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/config/gcp-service-account.json

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./scripts:/opt/airflow/scripts
      - ./sql:/opt/airflow/sql
      - ./data:/opt/airflow/data
      - ./config:/opt/airflow/config

    user: "${AIRFLOW_UID:-50000}:0"

    command: scheduler

    depends_on:
      airflow-init:
        condition: service_completed_successfully
        
      airflow-apiserver:
        condition: service_healthy

    restart: always


  # --------------------------------------------------
  # Airflow DAG Processor
  # --------------------------------------------------
  airflow-dag-processor:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: climate-airflow-dag-processor

    working_dir: /opt/airflow

    env_file:
      - .env

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

      AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}

      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 10

      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'

      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}

      BIGQUERY_PROJECT: ${BIGQUERY_PROJECT}

      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME}

      GCS_LOCATION: ${GCS_LOCATION}

      GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/config/gcp-service-account.json

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./scripts:/opt/airflow/scripts
      - ./sql:/opt/airflow/sql
      - ./data:/opt/airflow/data
      - ./config:/opt/airflow/config

    user: "${AIRFLOW_UID:-50000}:0"

    command: dag-processor

    depends_on:
      airflow-init:
        condition: service_completed_successfully
        
      airflow-apiserver:
        condition: service_healthy

    restart: always


  # --------------------------------------------------
  # Airflow Triggerer
  # --------------------------------------------------
  airflow-triggerer:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: climate-airflow-triggerer

    env_file:
      - .env

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

      AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}

      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 10

      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'

      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}

      BIGQUERY_PROJECT: ${BIGQUERY_PROJECT}

      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME}

      GCS_LOCATION: ${GCS_LOCATION}

      GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/config/gcp-service-account.json

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./scripts:/opt/airflow/scripts
      - ./sql:/opt/airflow/sql
      - ./data:/opt/airflow/data
      - ./config:/opt/airflow/config

    user: "${AIRFLOW_UID:-50000}:0"

    command: triggerer

    depends_on:
      airflow-init:
        condition: service_completed_successfully
        
      airflow-apiserver:
        condition: service_healthy

    restart: always


  # --------------------------------------------------
  # Standalone Climate Pipeline
  # --------------------------------------------------
  climate-pipeline:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: climate-pipeline

    env_file:
      - .env

    environment:
      BIGQUERY_PROJECT: ${BIGQUERY_PROJECT}

      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME}

      GCS_LOCATION: ${GCS_LOCATION}

      GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/config/gcp-service-account.json

    volumes:
      - ./data:/opt/airflow/data
      - ./scripts:/opt/airflow/scripts
      - ./sql:/opt/airflow/sql
      - ./config:/opt/airflow/config

    command: python -m scripts.run_pipeline

    profiles:
      - pipeline


volumes:
  postgres-db-volume: